<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Patient History</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/style.css') }}">

</head>

<body>

<div class="dashboard">

<h1>
📋 Patient History
</h1>

<table class="history-table">

<tr>

<th>ID</th>
<th>Name</th>
<th>Risk</th>
<th>Disease</th>

</tr>

{% for row in reports %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
