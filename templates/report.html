<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Generate Report</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>📄 Generate Report</h1>

        <form method="POST">

            <input
            type="text"
            name="name"
            placeholder="Patient Name"
            required>

            <input
            type="text"
            name="risk"
            placeholder="Risk Level"
            required>

            <input
            type="text"
            name="disease"
            placeholder="Disease Prediction"
            required>

            <button type="submit">

                Generate PDF

            </button>

        </form>

    </div>

</div>

</body>
</html>
